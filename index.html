<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tirador de Palitos · Nuestra historia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="eyebrow">Un juego para nosotros</div>
  <h1>Tirador de Palitos</h1>
  <p class="sub">Acierta al blanco: cada vez será más pequeño y más rápido.</p>
  <div class="hud">
    <span>Puntos <b id="score">0</b></span>
    <span>Nivel <b id="level">1</b></span>
    <span>Vidas <b id="lives">❤❤❤</b></span>
  </div>
  <canvas id="game" width="800" height="450"></canvas>
  <p class="help">Mouse: apuntar · Clic / Espacio: disparar · W/S o ↑/↓: moverte · R: reiniciar</p>
  <script src="script.js"></script>
</body>
</html>
